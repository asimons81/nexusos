[project]
name = "nexusos"
version = "0.1.0a1"
description = "Local-first knowledge operating system for AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Tony Simons" },
]
keywords = ["knowledge-management", "ai-agents", "local-first", "mcp", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "mcp>=2.0.0",
]

[project.scripts]
nexusos = "nexusos.cli.main:app"

[project.urls]
Homepage = "https://github.com/asimons81/nexusOS"
Documentation = "https://github.com/asimons81/nexusOS/tree/main/docs"
Repository = "https://github.com/asimons81/nexusOS"
Issues = "https://github.com/asimons81/nexusOS/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusos"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nexusos/**/*.py",
    "src/nexusos/ui/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "ROADMAP.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "AGENTS.md",
    "docs/",
    "examples/",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "RUF", "TCH", "PT"]
ignore = ["B008", "B904", "TC001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["nexusos"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT011", "B017"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
packages = ["nexusos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--tb=short", "-q"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/nexusos"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.1",
    "mypy>=1.8",
]
