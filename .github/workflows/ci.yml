name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Full supported matrix (ROADMAP A3-02): every OS x Python leg runs the
  # complete contract — unit, integration, and security tests — plus lint,
  # format, type-check, and the version smoke test. Integration tests are
  # intentionally not split out of the matrix: they exercise CLI/service/MCP
  # flows that must stay green on all supported platforms. Platform-specific
  # skips, if any are ever needed, must be narrow, justified, and documented.
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NO_COLOR: "1"
      TYPER_USE_RICH: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test (full suite, with coverage)
        run: |
          uv run pytest --cov=nexusos \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            -q

      # A3-03: security-critical modules keep targeted floors even when the
      # aggregate passes. coverage report --include uses the same data file as
      # the pytest run above; patterns are cross-platform (coverage normalizes
      # path separators). Baselines measured 2026-08-03:
      #   core/path_safety.py 90%, indexing/lock.py 77%,
      #   services/serve_service.py 78%, mcp/server.py 69%, mcp/__main__.py 97%.
      - name: Security module coverage floors
        run: |
          uv run coverage report --include="*/core/path_safety.py" --fail-under=85
          uv run coverage report --include="*/indexing/lock.py" --fail-under=75
          uv run coverage report --include="*/services/serve_service.py" --fail-under=75
          uv run coverage report --include="*/mcp/server.py" --fail-under=65
          uv run coverage report --include="*/mcp/__main__.py" --fail-under=90

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

      - name: Smoke test
        run: |
          uv run nexusos version
