name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Full supported matrix (ROADMAP A3-02): every OS x Python leg runs the
  # complete contract — unit, integration, and security tests — plus lint,
  # format, type-check, and the version smoke test. Integration tests are
  # intentionally not split out of the matrix: they exercise CLI/service/MCP
  # flows that must stay green on all supported platforms. Platform-specific
  # skips, if any are ever needed, must be narrow, justified, and documented.
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NO_COLOR: "1"
      TYPER_USE_RICH: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test (full suite)
        run: uv run pytest -q

      - name: Contract tests (A3-05)
        run: uv run pytest tests/contracts/ -q

      - name: Smoke test
        run: |
          uv run nexusos version
